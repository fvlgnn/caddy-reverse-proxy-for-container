name: Validate example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start the example
        run: docker compose up --build --wait --wait-timeout 120

      - name: Test documented routes
        run: |
          curl --fail --retry 5 http://localhost:8000/
          curl --fail --retry 5 http://localhost:8000/app-fe/
          curl --fail --retry 5 http://localhost:8000/app-be/v1/get/once
          curl --fail --retry 5 http://localhost:8000/app-be/sub-path/v1/get
          curl --fail --retry 5 http://localhost:8000/sub-path/v1/get

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the example
        if: always()
        run: docker compose down --volumes
